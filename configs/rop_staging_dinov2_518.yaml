# Arm G (PROTOCOL_V2 Amendment 4a): arm B (configs/rop_staging_dinov2.yaml) at DINOv2's native
# 518 px. Every key equals B's except preprocess.image_size; tests/test_v3_parity.py enforces it.
# The other comments below are B's (differences from arm C).
disease: rop_staging
seed: 42

data:
  num_classes: 6
  class_names: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5", "AP-ROP"]
  manifest: results/prepared/rop_staging/fold_0.csv
  presplit: true
  group_col: patient_id

preprocess:
  image_size: 518       # ARM G: 37x14, DINOv2's pre-training grid (B: 392 with interpolated
                        # position embeddings); stage 1 is a 1-2 px line at 392
  circle_crop: true
  letterbox: true
  ben_graham: false
  clahe: true
  normalize: imagenet   # CHANGED: ImageNet statistics for the DINOv2 control
  cached: false         # CHANGED (new key): no pre-cached preprocessing by default
  cache_root: null

model:
  arch: dinov2_s  # CHANGED: the ViT arm under test
  weights_path: null    # CHANGED: DINOv2 weights come from the hub, no local file
  pretrained: true
  head: classification
  dropout: 0.3
  drop_path: 0.1        # CHANGED (new key): stochastic depth, standard for ViT fine-tuning

train:
  epochs: 20
  batch_size: 16
  lr: 1.0e-4            # CHANGED: ViT fine-tuning lr (peak lr of the top layer under layer decay)
  layer_decay: 0.8      # CHANGED (new key): layer-wise lr decay, standard for ViT fine-tuning
  weight_decay: 0.05
  label_smoothing: 0.05
  amp: true
  strong_aug: true
  site_randomization: true
  loss: ce
  class_balanced: true
  class_balanced_beta: 0.999
  weighted_sampler: false
  num_workers: 4

eval:
  early_stopping: false
  primary_metric: macro_f1
  qwk_classes: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5"]
  report_per_class_recall: true
  unvalidated_classes: ["Stage 4/5", "AP-ROP"]
