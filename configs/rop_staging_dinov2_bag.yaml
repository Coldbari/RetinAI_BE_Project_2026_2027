# Arm D (PROTOCOL_V2 Amendment 3c): arm B (configs/rop_staging_dinov2.yaml) plus an exam-level
# log-sum-exp bag loss on Ostrava sessions. Every key equals B's except the train.bag_loss block;
# tests/test_v3_parity.py enforces it. The comments below are B's (differences from arm C).
disease: rop_staging
seed: 42

data:
  num_classes: 6
  class_names: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5", "AP-ROP"]
  manifest: results/prepared/rop_staging/fold_0.csv
  presplit: true
  group_col: patient_id

preprocess:
  image_size: 392       # CHANGED: 28x14 patch grid for ViT-S/14 (384 is not a multiple of 14)
  circle_crop: true
  letterbox: true
  ben_graham: false
  clahe: true
  normalize: imagenet   # CHANGED: ImageNet statistics for the DINOv2 control
  cached: false         # CHANGED (new key): no pre-cached preprocessing by default
  cache_root: null

model:
  arch: dinov2_s  # CHANGED: the ViT arm under test
  weights_path: null    # CHANGED: DINOv2 weights come from the hub, no local file
  pretrained: true
  head: classification
  dropout: 0.3
  drop_path: 0.1        # CHANGED (new key): stochastic depth, standard for ViT fine-tuning

train:
  epochs: 20
  batch_size: 16
  lr: 1.0e-4            # CHANGED: ViT fine-tuning lr (peak lr of the top layer under layer decay)
  layer_decay: 0.8      # CHANGED (new key): layer-wise lr decay, standard for ViT fine-tuning
  weight_decay: 0.05
  label_smoothing: 0.05
  amp: true
  strong_aug: true
  site_randomization: true
  loss: ce
  class_balanced: true
  class_balanced_beta: 0.999
  weighted_sampler: false
  num_workers: 4
  bag_loss:             # ARM D (new block): Ostrava sessions are the loss unit (models/common/bag_loss.py)
    enabled: true
    source: ostrava     # the session key is models.common.units.unit_keys' Ostrava key
    k: 8                # frames per bag, drawn without replacement each epoch (all if fewer)
    tau: 1.0            # bag logit = tau * logsumexp(frame logits / tau)

eval:
  early_stopping: false
  primary_metric: macro_f1
  qwk_classes: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5"]
  report_per_class_recall: true
  unvalidated_classes: ["Stage 4/5", "AP-ROP"]
