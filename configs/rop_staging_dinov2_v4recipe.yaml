# Arm I (PROTOCOL_V2 Amendment 5b): arm H (v4 pool) plus the v4 recipe: EMA weight averaging, a one-epoch
# head warm-up, label smoothing 0.10 and the aug_v4 block. Differs from H only in train.arm_tag and
# those recipe keys; tests/test_v3_parity.py enforces it. The comments below are B's.
disease: rop_staging
seed: 42

data:
  num_classes: 6
  class_names: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5", "AP-ROP"]
  manifest: results/prepared/rop_staging/v4/fold_0.csv  # arm H: the v4 pool
  presplit: true
  group_col: patient_id

preprocess:
  image_size: 392       # CHANGED: 28x14 patch grid for ViT-S/14 (384 is not a multiple of 14)
  circle_crop: true
  letterbox: true
  ben_graham: false
  clahe: true
  normalize: imagenet   # CHANGED: ImageNet statistics for the DINOv2 control
  cached: false         # CHANGED (new key): no pre-cached preprocessing by default
  cache_root: null

model:
  arch: dinov2_s  # CHANGED: the ViT arm under test
  weights_path: null    # CHANGED: DINOv2 weights come from the hub, no local file
  pretrained: true
  head: classification
  dropout: 0.3
  drop_path: 0.1        # CHANGED (new key): stochastic depth, standard for ViT fine-tuning

train:
  arm_tag: v4recipe
  epochs: 20
  batch_size: 16
  lr: 1.0e-4            # CHANGED: ViT fine-tuning lr (peak lr of the top layer under layer decay)
  layer_decay: 0.8      # CHANGED (new key): layer-wise lr decay, standard for ViT fine-tuning
  weight_decay: 0.05
  label_smoothing: 0.10   # arm I (Amendment 5b); B has 0.05
  amp: true
  strong_aug: true
  site_randomization: true
  loss: ce
  class_balanced: true
  class_balanced_beta: 0.999
  weighted_sampler: false
  num_workers: 4
  ema_decay: 0.999
  head_warmup_epochs: 1
  aug_v4:
    enabled: true
    rotation: 180
    min_crop_scale: 0.85
    gamma: [0.7, 1.4]
    gamma_p: 0.5
    noise_sigma: 0.02
    noise_p: 0.3
    fourier_block: 3
    fourier_p: 0.5

eval:
  early_stopping: false
  primary_metric: macro_f1
  qwk_classes: ["Normal", "Stage 1", "Stage 2", "Stage 3", "Stage 4/5"]
  report_per_class_recall: true
  unvalidated_classes: ["Stage 4/5", "AP-ROP"]
