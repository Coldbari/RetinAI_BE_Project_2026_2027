disease: rop_staging
seed: 1337
data:
  num_classes: 6
  class_names:
  - Normal
  - Stage 1
  - Stage 2
  - Stage 3
  - Stage 4/5
  - AP-ROP
  manifest: results/prepared/rop_staging/_v3_fold3.csv
  presplit: true
  group_col: patient_id
preprocess:
  image_size: 392
  circle_crop: true
  letterbox: true
  ben_graham: false
  clahe: true
  normalize: imagenet
  cached: true
  cache_root: /tmp/_cache768
model:
  arch: dinov2_s
  weights_path: null
  pretrained: true
  head: classification
  dropout: 0.3
  drop_path: 0.1
train:
  arm_tag: v4recipe
  epochs: 20
  batch_size: 16
  lr: 0.0001
  layer_decay: 0.8
  weight_decay: 0.05
  label_smoothing: 0.1
  amp: true
  strong_aug: true
  site_randomization: true
  loss: ce
  class_balanced: true
  class_balanced_beta: 0.999
  weighted_sampler: false
  num_workers: 4
  ema_decay: 0.999
  head_warmup_epochs: 1
  aug_v4:
    enabled: true
    rotation: 180
    min_crop_scale: 0.85
    gamma:
    - 0.7
    - 1.4
    gamma_p: 0.5
    noise_sigma: 0.02
    noise_p: 0.3
    fourier_block: 3
    fourier_p: 0.5
eval:
  early_stopping: false
  primary_metric: macro_f1
  qwk_classes:
  - Normal
  - Stage 1
  - Stage 2
  - Stage 3
  - Stage 4/5
  report_per_class_recall: true
  unvalidated_classes:
  - Stage 4/5
  - AP-ROP
_source: configs/rop_staging_dinov2_v4recipe.yaml
