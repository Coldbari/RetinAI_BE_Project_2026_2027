# Which model serves which disease, and WHICH PATIENT it is allowed to see.
#
# This deployment is ROP-ONLY. The earlier DR and Glaucoma models were removed from the
# product: glaucoma because a source-confound audit (and later a double-mounted collection)
# made its pooled AUC undefendable, DR because the project's active work is ROP and a demo
# should only expose what its authors currently stand behind.
#
# `weights`   : the .pth pulled from the Kaggle run (via git LFS). Missing weights -> the
#               disease shows "model not loaded" so the app still boots.
# `applies_to`: the patient contexts this model was TRAINED for. A model is never run on a
#               context outside this list.
#
# WHY ROUTING EXISTS: without it, every model ran on every upload. Measured consequence —
# the ROP model (trained only on preterm infants) flagged 41/45 adult eyes as ROP-positive.
# The context declaration is mandatory and the operator makes it, never the image.
# SCREENING RE-BASED, 2026-08-19. The binary ROP verdict is now produced by the STRUCTURED
# staging model's P(any ROP), not by the ResNet50 below. An external audit
# (scripts/rop_screening_external_spec.py) ran the ResNet50 over 663 images from a hospital
# it never trained on and found it degenerate there: at its 0.1933 threshold it flagged
# every single image, healthy eyes included, because that site's whole score distribution
# sits above the cut-off. External AUC 0.691; the structured model scored 0.821 on the same
# images. The threshold lives in results/rop/screening_rebase.json and is chosen by a stated
# rule (scripts/rop_rebase_screening.py), never hardcoded.
#
# STAGING + SCREENING MODEL REPLACED, 2026-11-01. Both the 6-class stage and the binary ROP
# verdict now come from the DINOv2 ViT-S/14 ensemble (five CV-fold checkpoints of seed 42, arm B
# of docs/paper/PROTOCOL_V2.md) declared under `staging:` below; the verdict is 1 - p(Normal)
# against arm B's pre-registered CV operating point (results/rop/v3/v3_scores.json). The
# EfficientNetV2-S structured model and its screening_rebase.json threshold are retired from
# serving; set RETINAI_LEGACY_STAGING=1 to load that model beside the ensemble for comparison
# (registry.legacy_staging; never served).
#
# The entry below is KEPT deliberately. It anchors the routing table and the gradability
# gate's ImageNet transform, and is the fallback if the ensemble's weights or operating point
# are ever absent — but it no longer decides.
staging:
  config: configs/rop_staging_deploy.yaml

models:
  - disease: ROP
    config: configs/rop.yaml
    weights: results/rop/weights.pth
    applies_to: [infant]

contexts:
  infant:
    label: Preterm infant (NICU screening)
    hint: >-
      ROP screening for premature infants. This deployment screens for ROP only; it has no
      adult models, so adult fundus photographs have nothing valid to run against.
    runs: [ROP]

# COMPARISON MODEL, 2026-11-07 — a second opinion shown BESIDE arm B, never a decision.
# A teammate's RETFound-DINOv2 ViT-L/14 with LoRA adapters (rank 16, alpha 32, attention + MLP
# layers) and a 4-class head (Normal, Stage 1, 2, 3), three seeds averaged. Trained on a
# PHOTO-level 80/10/10 split of 3,141 of our photos (ROP-VL, Multi-View, Shenzhen), so its
# reported 84.4% test accuracy (315 photos, QWK 0.900) has infant leakage and it has seen
# 390 development-half and 331 sealed-half photos; it can never be scored on our test sets.
# Demo on NEW photos only; the app warns when an upload is a photo in results/comparison/
# seen_photos.json. Files come from scripts/deploy_comparison_weights.py (one shared frozen
# backbone + one adapter file per seed). Missing files -> the panel says so and the app runs.
comparison:
  name: "RETFound-DINOv2 ViT-L/14 + LoRA, 3-seed ensemble"
  credit: "trained by a RetinAI teammate (rop_foundation package, 4–5 Nov 2026)"
  backbone: results/comparison/retfound_dinov2_vitl14_backbone.pt
  adapters:
    - {seed: 42, file: results/comparison/adapters_s42.pt}
    - {seed: 1,  file: results/comparison/adapters_s1.pt}
    - {seed: 2,  file: results/comparison/adapters_s2.pt}
  tta: true            # 4-view flip average, as the source package reported its numbers
  seen_photos: results/comparison/seen_photos.json
  scores:              # from the source package's own test split (photo level, 315 photos)
    unit: photo
    n_test_photos: 315
    accuracy: 0.844
    qwk: 0.900
    auc: 0.964
    single_seed_accuracy: [0.787, 0.822, 0.832]
    split: "80/10/10 by photo, seed 42; 73% of test photos share an infant with training"
    overlap_with_our_tests: "trained on 390 development-half and 331 sealed-half photos"
